services:
  - type: web
    name: documind-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: documents
      - key: GEMINI_API
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
